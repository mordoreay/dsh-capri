name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # the host half in a fake Cordis context: routes, guards, clamps, approvals, turns, sound
      - name: host half
        run: node tools/review.mjs

      # every drawing exists, decodes, and every clip's timings and line sets resolve
      - name: clips
        run: node tools/verify-clips.mjs
